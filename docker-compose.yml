version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: dealeros-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: dealeros
      POSTGRES_PASSWORD: dealeros_dev_password
      POSTGRES_DB: dealeros_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dealeros -d dealeros_db"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
    driver: local
